<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Modern ChatGPT-style AI chat interface">

    <title>AI Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div class="app">

        <!-- ==============================
         SIDEBAR
    =============================== -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">

                <button class="new-chat" id="newChat" type="button">
                    <span class="new-chat-icon">＋</span>
                    <span>New chat</span>
                </button>

            </div>


            <!-- CHAT HISTORY -->

            <div class="chat-history">

                <p class="history-title">
                    Today
                </p>

                <button class="history-item active" type="button">
                    <span>💬</span>
                    <span>AI Chat Interface</span>
                </button>

                <button class="history-item" type="button">
                    <span>💬</span>
                    <span>Website ideas</span>
                </button>

                <button class="history-item" type="button">
                    <span>💬</span>
                    <span>Learn JavaScript</span>
                </button>

                <button class="history-item" type="button">
                    <span>💬</span>
                    <span>HTML & CSS project</span>
                </button>

            </div>


            <!-- SIDEBAR BOTTOM -->

            <div class="sidebar-bottom">

                <button class="sidebar-btn" type="button">
                    <span>⚙️</span>
                    <span>Settings</span>
                </button>

                <button class="sidebar-btn" type="button">
                    <span>👤</span>
                    <span>My Account</span>
                </button>

            </div>

        </aside>


        <!-- ==============================
         MAIN
    =============================== -->

        <main class="main">

            <!-- HEADER -->

            <header class="header">

                <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">
                    ☰
                </button>


                <button class="model-name" type="button">
                    <span>AI Assistant</span>
                    <span class="model-arrow">▾</span>
                </button>


                <div class="header-actions">

                    <!-- THEME -->

                    <button class="theme-btn" id="themeBtn" type="button" title="Switch to dark mode"
                        aria-label="Toggle theme">
                        🌙
                    </button>


                    <!-- MORE -->

                    <button class="header-btn" type="button" aria-label="More options">
                        ⋯
                    </button>

                </div>

            </header>


            <!-- ==============================
           CHAT AREA
      =============================== -->

            <section class="chat-area" id="chatArea">

                <!-- WELCOME -->

                <div class="welcome" id="welcome">

                    <div class="logo">
                        ✦
                    </div>

                    <h1>
                        How can I help you?
                    </h1>

                    <p>
                        Ask me anything, write code,
                        brainstorm ideas, or learn something new.
                    </p>


                    <!-- SUGGESTIONS -->

                    <div class="suggestions">

                        <button class="suggestion" type="button" data-prompt="Give me an idea for a new website">

                            <strong>💡</strong>

                            <span>
                                <b>Give me an idea</b>
                                <small>for a new website</small>
                            </span>

                        </button>


                        <button class="suggestion" type="button" data-prompt="Write some JavaScript code">

                            <strong>💻</strong>

                            <span>
                                <b>Write some code</b>
                                <small>in JavaScript</small>
                            </span>

                        </button>


                        <button class="suggestion" type="button" data-prompt="Explain something in simple terms">

                            <strong>📚</strong>

                            <span>
                                <b>Explain something</b>
                                <small>in simple terms</small>
                            </span>

                        </button>


                        <button class="suggestion" type="button" data-prompt="Help me learn a new skill">

                            <strong>🚀</strong>

                            <span>
                                <b>Help me learn</b>
                                <small>a new skill</small>
                            </span>

                        </button>

                    </div>

                </div>

            </section>


            <!-- ==============================
           INPUT
      =============================== -->

            <div class="input-wrapper">

                <div class="input-box">

                    <button class="attach-btn" type="button" title="Attach file" aria-label="Attach file">
                        ＋
                    </button>


                    <textarea id="messageInput" placeholder="Message AI Assistant..." rows="1"
                        aria-label="Message"></textarea>


                    <button class="send-btn" id="sendBtn" type="button" aria-label="Send message">
                        ↑
                    </button>

                </div>


                <p class="disclaimer">
                    AI can make mistakes. Check important information.
                </p>

            </div>

        </main>

    </div>
    <!-- JS -->
    <script src="js/index.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/history.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
